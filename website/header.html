{{ define "header" }}
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lariv — One Open Platform to Replace Every SaaS</title>
	<meta name="description"
		content="Replace third-party SaaS subscriptions under a single deployment. Lariv is a completely open, modular enterprise platform for self-hosted or fully managed business applications.">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
		rel="stylesheet">
	<style>
		/* RESET & BASE STYLES */
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		:root {
			--bg-base: #ffffff;
			--bg-surface: rgba(248, 250, 252, 0.8);
			--bg-surface-hover: rgba(241, 245, 249, 0.95);
			--border-glow: rgba(99, 102, 241, 0.08);
			--border-muted: rgba(0, 0, 0, 0.08);

			--color-primary: #4f46e5;
			--color-primary-glow: rgba(79, 70, 229, 0.15);
			--color-secondary: #7c3aed;
			--color-accent: #0d9488;
			--color-accent-glow: rgba(13, 148, 136, 0.15);

			--text-main: #0f172a;
			--text-muted: #475569;
			--text-dark: #64748b;

			--font-display: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			--font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			--font-code: 'JetBrains Mono', monospace;

			--transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
		}

		html {
			scroll-behavior: smooth;
			background-color: var(--bg-base);
			font-family: var(--font-body);
			color: var(--text-main);
			overflow-x: hidden;
			line-height: 1.6;
		}

		body {
			position: relative;
		}

		@keyframes float-ambient {
			0% {
				transform: translate(0, 0) scale(1);
			}

			50% {
				transform: translate(4vw, 5vh) scale(1.1);
			}

			100% {
				transform: translate(-3vw, -4vh) scale(0.9);
			}
		}

		/* TYPOGRAPHY */
		h1,
		h2,
		h3,
		h4 {
			font-family: var(--font-display);
			font-weight: 700;
			letter-spacing: -0.02em;
			line-height: 1.2;
		}

		p {
			color: var(--text-muted);
		}

		/* UTILITIES */
		.container {
			max-width: 1200px;
			margin: 0 auto;
			padding: 0 32px;
		}

		.gradient-text {
			background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #0d9488 100%);
			background-clip: text;
			color: transparent;
		}

		.badge {
			display: inline-flex;
			align-items: center;
			padding: 0.35rem 0.85rem;
			border-radius: 9999px;
			font-size: 0.75rem;
			font-weight: 600;
			letter-spacing: 0.05em;
			text-transform: uppercase;
			background: rgba(79, 70, 229, 0.06);
			color: #4f46e5;
			border: 1px solid rgba(79, 70, 229, 0.15);
			margin-bottom: 1rem;
		}

		/* BUTTONS */
		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			padding: 0.8rem 1.6rem;
			border-radius: 8px;
			font-family: var(--font-body);
			font-weight: 600;
			font-size: 0.95rem;
			text-decoration: none;
			cursor: pointer;
			transition: var(--transition-smooth);
			border: none;
		}

		.btn-primary {
			background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-secondary) 100%);
			color: #fff;
			box-shadow: 0 4px 20px var(--color-primary-glow);
		}

		.btn-primary:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 28px rgba(79, 70, 229, 0.3);
		}

		.btn-secondary {
			background: rgba(0, 0, 0, 0.02);
			color: var(--text-main);
			border: 1px solid var(--border-muted);
			backdrop-filter: blur(4px);
		}

		.btn-secondary:hover {
			background: rgba(0, 0, 0, 0.05);
			border-color: rgba(0, 0, 0, 0.15);
			transform: translateY(-2px);
		}

		/* HEADER & NAVIGATION */
		header {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			max-width: 100%;
			z-index: 100;
			transition: var(--transition-smooth);
			border-bottom: 1px solid transparent;
		}

		header.scrolled {
			background: rgba(255, 255, 255, 0.85);
			backdrop-filter: blur(12px);
			border-color: var(--border-muted);
		}

		.nav-container {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 1rem;
			height: 4.5rem;
			position: relative;
			width: 100%;
			max-width: 100%;
			min-width: 0;
		}

		.logo {
			display: flex;
			align-items: center;
			gap: 0.6rem;
			font-family: var(--font-display);
			font-weight: 800;
			font-size: 1.5rem;
			text-decoration: none;
			color: var(--text-main);
			min-width: 0;
			flex: 0 1 auto;
			max-width: calc(100% - 3.5rem);
		}

		.logo img {
			display: block;
			height: 2.5rem;
			width: auto;
			max-width: 100%;
			object-fit: contain;
		}

		.logo-icon {
			width: 2rem;
			height: 2rem;
			background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
			border-radius: 6px;
			display: flex;
			align-items: center;
			justify-content: center;
			color: #fff;
			font-weight: 800;
			font-size: 1.1rem;
			box-shadow: 0 0 15px var(--color-primary-glow);
		}

		.nav-menu {
			display: flex;
			gap: 2rem;
			list-style: none;
		}

		.nav-link {
			text-decoration: none;
			color: var(--text-muted);
			font-weight: 500;
			font-size: 0.95rem;
			transition: var(--transition-smooth);
		}

		.nav-link:hover {
			color: var(--text-main);
		}

		.nav-cta {
			display: flex;
			align-items: center;
			gap: 1rem;
		}

		.mobile-nav-toggle {
			display: none;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 5px;
			width: 40px;
			height: 40px;
			background: transparent;
			border: 1px solid var(--border-muted);
			border-radius: 8px;
			cursor: pointer;
			padding: 0;
			transition: var(--transition-smooth);
			z-index: 101;
		}

		.mobile-nav-toggle:hover,
		.mobile-nav-toggle:focus {
			background: rgba(0, 0, 0, 0.04);
			border-color: rgba(0, 0, 0, 0.15);
		}

		.hamburger-bar {
			width: 20px;
			height: 2px;
			background-color: var(--text-main);
			border-radius: 2px;
			transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
		}

		.mobile-nav-toggle.open .hamburger-bar:nth-child(1) {
			transform: translateY(7px) rotate(45deg);
		}

		.mobile-nav-toggle.open .hamburger-bar:nth-child(2) {
			opacity: 0;
			transform: scaleX(0);
		}

		.mobile-nav-toggle.open .hamburger-bar:nth-child(3) {
			transform: translateY(-7px) rotate(-45deg);
		}

		/* HERO BASE */
		.hero {
			position: relative;
			padding-top: 10rem;
			padding-bottom: 6rem;
			min-height: 90vh;
			display: flex;
			align-items: center;
			overflow-x: clip;
			width: 100%;
		}

		/* SECTIONS */
		.section-padding {
			padding: 6.5rem 0;
		}

		.section-header {
			text-align: center;
			margin-bottom: 4rem;
			position: relative;
		}

		.section-header h2 {
			font-size: 2.75rem;
			margin-bottom: 1rem;
		}

		.section-header p {
			max-width: 600px;
			margin: 0 auto;
			font-size: 1.1rem;
		}

		/* CARDS */
		.card {
			background: var(--bg-surface);
			border: 1px solid var(--border-muted);
			border-radius: 12px;
			padding: 2.5rem;
			transition: var(--transition-smooth);
			position: relative;
			overflow: hidden;
		}

		.card:hover {
			transform: translateY(-5px);
			border-color: rgba(99, 102, 241, 0.35);
			background: var(--bg-surface-hover);
			box-shadow: 0 12px 30px rgba(99, 102, 241, 0.05);
		}

		.card-icon {
			width: 3.5rem;
			height: 3.5rem;
			border-radius: 8px;
			background: rgba(255, 255, 255, 0.03);
			border: 1px solid rgba(255, 255, 255, 0.08);
			display: flex;
			align-items: center;
			justify-content: center;
			margin-bottom: 1.75rem;
			color: var(--color-primary);
			transition: var(--transition-smooth);
		}

		.card:hover .card-icon {
			background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
			color: #fff;
			box-shadow: 0 0 15px var(--color-primary-glow);
			border-color: transparent;
		}

		.card h3 {
			font-size: 1.4rem;
		}

		.card p {
			font-size: 0.95rem;
			line-height: 1.6;
		}

		/* FOOTER */
		footer {
			border-top: 1px solid var(--border-muted);
			padding: 4rem 0 2rem 0;
			background: #f8fafc;
			margin-top: 2rem;
		}

		.footer-grid {
			display: grid;
			grid-template-columns: 1.5fr repeat(3, 1fr);
			gap: 3rem;
			margin-bottom: 3rem;
		}

		.footer-brand p {
			margin-top: 1rem;
			font-size: 0.95rem;
		}

		.footer-column h4 {
			font-size: 0.95rem;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: var(--text-main);
			margin-bottom: 1.25rem;
		}

		.footer-links {
			list-style: none;
			display: flex;
			flex-direction: column;
			gap: 0.75rem;
		}

		.footer-links a {
			text-decoration: none;
			color: var(--text-muted);
			font-size: 0.9rem;
			transition: var(--transition-smooth);
		}

		.footer-links a:hover {
			color: var(--text-main);
		}

		.footer-bottom {
			display: flex;
			justify-content: space-between;
			align-items: center;
			border-top: 1px solid rgba(0, 0, 0, 0.05);
			padding-top: 2rem;
			font-size: 0.85rem;
			color: var(--text-dark);
		}

		.social-links {
			display: flex;
			gap: 1rem;
		}

		.social-link {
			color: var(--text-dark);
			text-decoration: none;
			transition: var(--transition-smooth);
			font-size: 1.2rem;
		}

		.social-link:hover {
			color: var(--text-main);
		}

		/* RESPONSIVE BREAKPOINTS (GLOBAL HEADER & FOOTER) */
		@media (max-width: 992px) {
			.footer-grid {
				grid-template-columns: repeat(2, 1fr);
			}
		}

		@media (max-width: 768px) {
			.container {
				padding: 0 1.25rem;
			}

			.footer-grid {
				grid-template-columns: 1fr;
				gap: 2rem;
			}

			.logo img {
				height: 2rem;
			}

			.mobile-nav-toggle {
				display: flex;
				flex-shrink: 0;
			}

			.nav-menu {
				position: absolute;
				top: calc(100% + 0.5rem);
				left: 0;
				right: 0;
				width: 100%;
				max-width: 100%;
				box-sizing: border-box;
				background: rgba(255, 255, 255, 0.96);
				backdrop-filter: blur(16px);
				border: 1px solid var(--border-muted);
				border-radius: 12px;
				padding: 0.75rem;
				flex-direction: column;
				gap: 0.25rem;
				box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.04);
				opacity: 0;
				visibility: hidden;
				transform: translateY(-12px) scale(0.98);
				transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
				pointer-events: none;
				z-index: 102;
			}

			.nav-menu.open {
				opacity: 1;
				visibility: visible;
				transform: translateY(0) scale(1);
				pointer-events: auto;
			}

			.nav-menu li {
				width: 100%;
			}

			.nav-link {
				display: block;
				padding: 0.75rem 1rem;
				border-radius: 8px;
				font-size: 1rem;
				font-weight: 500;
				color: var(--text-main);
				transition: var(--transition-smooth);
			}

			.nav-link:hover,
			.nav-link:focus {
				background: rgba(79, 70, 229, 0.08);
				color: var(--color-primary);
			}
		}
	</style>
</head>

<body>


	<!-- NAVIGATION -->
	<header id="header">
		<div class="container nav-container">
			<a href="/" class="logo">
				<img src="/static/logo.svg" alt="Lariv Logo">
			</a>
			<button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle Navigation Menu"
				aria-expanded="false">
				<span class="hamburger-bar"></span>
				<span class="hamburger-bar"></span>
				<span class="hamburger-bar"></span>
			</button>
			<ul class="nav-menu" id="navMenu">
				<li><a href="/" class="nav-link">Home</a></li>
				<li><a href="/pricing" class="nav-link">Pricing</a></li>
				<li><a href="/blogs" class="nav-link">Blog</a></li>
			</ul>
		</div>
	</header>
	<script>
		(function () {
			function initMobileNav() {
				const toggleBtn = document.getElementById('mobileNavToggle');
				const navMenu = document.getElementById('navMenu');

				if (toggleBtn && navMenu && !toggleBtn.dataset.bound) {
					toggleBtn.dataset.bound = 'true';
					toggleBtn.addEventListener('click', (e) => {
						e.stopPropagation();
						const isOpen = navMenu.classList.contains('open');
						navMenu.classList.toggle('open', !isOpen);
						toggleBtn.classList.toggle('open', !isOpen);
						toggleBtn.setAttribute('aria-expanded', !isOpen);
					});

					document.addEventListener('click', (e) => {
						if (!navMenu.contains(e.target) && !toggleBtn.contains(e.target)) {
							navMenu.classList.remove('open');
							toggleBtn.classList.remove('open');
							toggleBtn.setAttribute('aria-expanded', 'false');
						}
					});

					navMenu.querySelectorAll('a').forEach(link => {
						link.addEventListener('click', () => {
							navMenu.classList.remove('open');
							toggleBtn.classList.remove('open');
							toggleBtn.setAttribute('aria-expanded', 'false');
						});
					});
				}
			}

			if (document.readyState === 'loading') {
				document.addEventListener('DOMContentLoaded', initMobileNav);
			} else {
				initMobileNav();
			}
		})();
	</script>
	{{ end }}
